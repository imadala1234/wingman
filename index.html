<title>WingMan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app shell. Fixed header (title, bell, sub-tabs), scrolling content in the middle, fixed five-tab bar, floating add button. */
:root {
  --bg: #EDF1F6;
  --surface: #FFFFFF;
  --surface2: #E2E8F1;
  --ink: #0C1A31;
  --muted: #566781;
  --line: #D1D9E5;
  --accent: #F2A900;
  --on-accent: #1A1200;
  --accent-text: #8A5600;
  --ok: #1B7F52;
  --warn: #A85A00;
  --bad: #B8322A;
  --f-display: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1426; --surface: #12213B; --surface2: #1B2D4D; --ink: #EAF0FA; --muted: #93A3BF; --line: #263A5B;
    --accent: #F5B82E; --on-accent: #1A1200; --accent-text: #F5B82E; --ok: #4CC38A; --warn: #F5A524; --bad: #FF7B72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1426; --surface: #12213B; --surface2: #1B2D4D; --ink: #EAF0FA; --muted: #93A3BF; --line: #263A5B;
  --accent: #F5B82E; --on-accent: #1A1200; --accent-text: #F5B82E; --ok: #4CC38A; --warn: #F5A524; --bad: #FF7B72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { height: 100%; overflow: hidden; background: var(--surface); }
body { position: fixed; inset: 0; margin: 0; padding: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select, textarea { font-size: 16px !important; }
.f { min-width: 0; }
.f input[type=date], .drow input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; box-sizing: border-box; text-align: left; }
.f input[type=date]::-webkit-date-and-time-value { text-align: left; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.section { display: flex; flex-direction: column; gap: 8px; }
.sechead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Shell */
.top { flex: none; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
#top { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 8px 10px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.app { max-width: 520px; margin: 0 auto; padding-block: 12px 24px; display: flex; flex-direction: column; gap: 14px; }
.scroll.fabpad .app { padding-bottom: 80px; }

/* Page header */
.pagehead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.pagehead .titles { min-width: 0; display: flex; flex-direction: column; gap: 0; }
.pagehead h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 29px; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; overflow-wrap: anywhere; }
.bell { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink); }
.bell:hover { background: var(--surface2); }
.bell svg { width: 21px; height: 21px; }
.bell .badge { top: -4px; right: -4px; left: auto; border: 2px solid var(--bg); box-sizing: content-box; }

/* Next flight, compact */
.hero { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.hero .label { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.hero .r1, .hero .r2, .hero .r3 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hero .r3 { flex-wrap: wrap; }
.hero-count { font-family: var(--f-display); font-weight: 600; font-size: 34px; line-height: 1; color: var(--accent-hero, var(--accent)); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hero-route { display: flex; align-items: center; gap: 8px; }
.hero-route .code { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; }
.hero-route .line { width: 30px; height: 1px; background: color-mix(in srgb, var(--bg) 35%, transparent); position: relative; }
.hero-route .line svg { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%) rotate(90deg); fill: var(--accent-hero, var(--accent)); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: color-mix(in srgb, var(--bg) 78%, transparent); }
.hero-meta b { font-family: var(--f-mono); font-weight: 500; color: var(--bg); }
.hero .btn { min-height: 30px; padding: 4px 10px; font-size: 12px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: #1B2D4D; color: #EAF0FA; } :root:not([data-theme="light"]) .hero .label { color: #93A3BF; } :root:not([data-theme="light"]) .hero-meta { color: #B8C5DB; } :root:not([data-theme="light"]) .hero-meta b { color: #EAF0FA; } :root:not([data-theme="light"]) .hero-route .line { background: #3A5073; } }
:root[data-theme="dark"] .hero { background: #1B2D4D; color: #EAF0FA; }
:root[data-theme="dark"] .hero .label { color: #93A3BF; }
:root[data-theme="dark"] .hero-meta { color: #B8C5DB; }
:root[data-theme="dark"] .hero-meta b { color: #EAF0FA; }
:root[data-theme="dark"] .hero-route .line { background: #3A5073; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); }
.pill.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.pill.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, transparent); }
.pill.idle { color: var(--muted); background: transparent; }
.hero .pill.ok { color: #4CC38A; } .hero .pill.warn { color: #F5B82E; } .hero .pill.bad { color: #FF7B72; } .hero .pill.idle { color: #B8C5DB; }

/* Trip cards */
.trip { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.trip-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 16px 8px; }
.trip-head h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.leg { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; align-items: center; }
.leg:hover { background: var(--surface2); }
.leg .route { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.05; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.leg .route svg { width: 14px; height: 14px; fill: var(--muted); transform: rotate(90deg); flex: none; }
.leg .sub { font-size: 13px; color: var(--muted); grid-column: 1; }
.leg .side { grid-row: 1 / span 2; grid-column: 2; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.leg .when { font-family: var(--f-mono); font-size: 13px; }
.trip.past { opacity: .82; }

/* Cards, lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.card.tight { padding: 12px 14px; gap: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; padding-top: 0; }
.row:last-child { padding-bottom: 0; }
.row > div { min-width: 0; }
.row .t { font-weight: 500; overflow-wrap: anywhere; }
.row .d { font-size: 13px; color: var(--muted); }
button.row { width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; }
.alert { display: grid; grid-template-columns: 10px 1fr; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.alert:first-child { border-top: 0; }
.alert .dot { width: 8px; height: 8px; margin-top: 7px; border-radius: 50%; background: var(--line); }
.alert.unread .dot { background: var(--accent); }
.alert .t { font-weight: 600; }
.alert .d { font-size: 14px; color: var(--muted); }
.alert .at { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 500; min-height: 42px; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 34px; padding: 6px 10px; font-size: 13px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--accent-text); font-weight: 500; font-size: 13px; }

/* Forms */
form { display: flex; flex-direction: column; gap: 14px; }
fieldset { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 14px 16px 16px; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-width: 0; }
legend { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 6px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 12px; color: var(--muted); font-weight: 500; }
.f input, .f select, .f textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; min-height: 42px; }
.f textarea { min-height: 72px; resize: vertical; }
.f input.caps { text-transform: uppercase; font-family: var(--f-mono); }
.err { color: var(--bad); font-size: 13px; }
@media (max-width: 380px) { fieldset { grid-template-columns: 1fr; } }

/* Toggle rows */
.sw { appearance: none; width: 46px; height: 28px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); position: relative; flex: none; cursor: pointer; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.sw:checked { background: var(--accent); border-color: var(--accent); }
.sw:checked::after { transform: translateX(18px); background: var(--on-accent); }

/* Segmented controls */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg-b { border: 0; background: none; border-radius: 8px; padding: 8px 6px; min-height: 38px; font-weight: 500; color: var(--muted); }
.seg-b[aria-checked="true"], .seg-b[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line), inset 0 -2px 0 var(--accent); }
.dotw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-left: 6px; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sw-c { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 42px; font-size: 13px; font-weight: 500; min-width: 0; }
.sw-c[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dotc { width: 16px; height: 16px; border-radius: 50%; flex: none; }
@media (max-width: 360px) { .swatches { grid-template-columns: repeat(2, 1fr); } }

/* Tab bar */
.tabs { flex: none; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: stretch; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 2px; color: var(--muted); font-size: 10.5px; font-weight: 500; white-space: nowrap; min-width: 0; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent-text); }
.badge { position: absolute; top: 0; left: calc(50% + 6px); min-width: 18px; height: 18px; border-radius: 9px; background: var(--bad); color: #fff; font-family: var(--f-mono); font-size: 10px; display: grid; place-items: center; padding: 0 5px; }

/* Floating add button, follows theme and theme colour */
.fab { position: fixed; z-index: 15; width: 58px; height: 58px; border-radius: 50%; border: 3px solid transparent; display: grid; place-items: center; padding: 0; color: var(--ink);
  right: max(16px, calc((100vw - 520px) / 2 + 16px), env(safe-area-inset-right, 0px));
  bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--accent) 26%, var(--surface)), var(--surface)) padding-box,
    conic-gradient(from 0deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #fff), var(--accent), color-mix(in srgb, var(--accent) 55%, var(--ink)), color-mix(in srgb, var(--accent) 70%, #fff), var(--accent)) border-box;
  box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 42%, transparent), 0 8px 20px rgba(3, 8, 24, .25);
  transition: transform .15s; }
.fab svg { width: 26px; height: 26px; }
.fab:hover { transform: scale(1.05); }
.fab:active { transform: scale(.95); }

/* Detail sheet: fixed bar, scrolling body */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; }
.sheet-bar { flex: none; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.sheet-top { max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; padding-top: 14px; padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.pass { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; position: relative; }
.pass-top { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 14px; }
.pass-route { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.pass-route .code { font-family: var(--f-display); font-weight: 700; font-size: 52px; line-height: .95; }
.pass-route .city { font-size: 12px; color: var(--muted); }
.pass-route .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.pass-route .mid svg { width: 22px; height: 22px; fill: var(--accent-text); transform: rotate(90deg); }
.pass-route .end { text-align: right; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.times .big { font-family: var(--f-display); font-weight: 600; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.times .r { text-align: right; }
.tight .times .big { font-size: 26px; }
.perf { border-top: 2px dashed var(--line); margin: 0 14px; position: relative; }
.perf::before, .perf::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { left: -25px; } .perf::after { right: -25px; }
.pass-bot { padding: 16px 18px 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pass-bot .v { font-family: var(--f-mono); font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.pass-bot .v.hl { color: var(--accent-text); }
.timeline { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 14px 1fr auto; gap: 12px; padding: 8px 0; position: relative; align-items: start; }
.timeline li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin-top: 5px; }
.timeline li.done::before { background: var(--ok); border-color: var(--ok); }
.timeline li.next::before { background: var(--accent); border-color: var(--accent); }
.timeline li .tt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; }
.kv dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
.copy { background: none; border: 1px solid var(--line); border-radius: 6px; font-family: var(--f-mono); font-size: 11px; padding: 2px 8px; margin-left: 8px; color: var(--muted); }

/* Journey */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .n { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .u { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.place { display: inline-flex; align-items: baseline; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-weight: 500; }
.place small { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
.jrow { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 16px; }
.jrow:first-child { border-top: 0; }
.jrow:hover { background: var(--surface2); }
.jrow .dt { font-family: var(--f-mono); font-size: 12px; color: var(--muted); line-height: 1.25; }
.jrow .rt { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; line-height: 1.05; }
.jrow .km { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; }
.yearh { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

/* Passports */
.pc { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.05; letter-spacing: .02em; text-transform: uppercase; }
.meter { height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.flag { font-size: 13px; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 10px; padding: 8px 10px; }

/* Live status */
.fchips { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }

    if (el.hasAttribute('data-fdel')) { var ff = findFlight(detail); if (ff) { ff.files = (ff.files || []).filter(function (x) { return x.id !== el.getAttribute('data-fdel'); }); save(); openDetail(detail); toast('Removed from the flight', 'The file stays in your Drive.'); } return; }
    if (el.hasAttribute('data-addcat')) { openAddSheet(el.getAttribute('data-addcat')); return; }
    if (el.hasAttribute('data-addmode')) { addMode = el.getAttribute('data-addmode'); rFrom = ''; rTo = ''; if (!addMode) searchQ = ''; render(); return; }
    if (el.hasAttribute('data-hint')) { searchQ = el.getAttribute('data-hint'); render(); return; }
    if (el.hasAttribute('data-sdate')) { searchDate = ymd(+el.getAttribute('data-sdate')); render(); return; }
    if (el.hasAttribute('data-addfor')) { addWho = el.getAttribute('data-addfor'); go('add-traveller'); return; }
    if (el.hasAttribute('data-addpax')) { var pi = document.getElementById('pax'), nm = el.getAttribute('data-addpax'); if (pi && (',' + pi.value + ',').toLowerCase().indexOf(nm.toLowerCase()) < 0) pi.value = (pi.value.trim() ? pi.value.trim().replace(/,$/, '') + ', ' : '') + nm; return; }
    if (el.hasAttribute('data-tsub')) { tsub = el.getAttribute('data-tsub'); render(); document.getElementById('scroll').scrollTop = 0; return; }
    if (el.hasAttribute('data-lsub')) { lsub = el.getAttribute('data-lsub'); render(); document.getElementById('scroll').scrollTop = 0; return; }
    if (el.hasAttribute('data-live')) { liveSel = el.getAttribute('data-live'); if (view !== 'live') go('live'); else render(); return; }
    if (el.hasAttribute('data-go')) { go(el.getAttribute('data-go')); return; }
    if (el.hasAttribute('data-open')) { e.preventDefault(); openDetail(el.getAttribute('data-open')); return; }
    if (el.hasAttribute('data-reveal')) { var rid = el.getAttribute('data-reveal'); revealed[rid] = !revealed[rid]; render(); return; }
    if (el.hasAttribute('data-pdel')) {
      if (el.getAttribute('data-armed')) { var pid = el.getAttribute('data-pdel'); S.passports = S.passports.filter(function (x) { return x.id !== pid; }); save(); render(); toast('Passport deleted'); }
      else { el.setAttribute('data-armed', '1'); el.textContent = 'Tap again to delete'; }
      return;
    }
    if (el.hasAttribute('data-copy')) {
      var v = el.getAttribute('data-copy');
      try { navigator.clipboard.writeText(v).then(function () { toast('Copied', v); }, function () { toast('Select to copy', v); }); } catch (x) { toast('Select to copy', v); }
      return;
    }
    if (el.hasAttribute('data-sim')) {
      var f = findFlight(el.getAttribute('data-sim')); if (!f) return;
      var pick = Math.random() < 0.5, al;
      if (pick) { var add = 10 + Math.floor(Math.random() * 3) * 5; f.delay += add; al = { type: 'delay', title: f.no + ' delayed ' + add + ' more min', body: 'New departure ' + tf(effDep(f), AP[f.from].tz) + ' from ' + AP[f.from].n + '.' }; }
      else { var g = (f.gate || 'B12'); var ng = g.replace(/\d+/, function (n) { return +n + 2; }); if (ng === g) ng = 'C3'; f.gate = ng; al = { type: 'gate', title: 'Gate change for ' + f.no, body: 'Gate ' + g + ' is now ' + ng + '.' }; }
      S.alerts.push({ id: 'a' + (S.nextId++), fid: f.id, type: al.type, title: al.title, body: al.body, at: Date.now(), unread: true });
      save(); toast(al.title, al.body);
      if (detail) openDetail(f.id);
      render(); return;
    }
    if (el.hasAttribute('data-del')) {
      if (el.getAttribute('data-armed')) { var id = el.getAttribute('data-del'); S.flights = S.flights.filter(function (x) { return x.id !== id; }); S.tracked = S.tracked.filter(function (x) { return x.id !== id; }); S.alerts = S.alerts.filter(function (x) { return x.fid !== id; }); save(); closeDetail(); toast('Flight removed'); }
      else { el.setAttribute('data-armed', '1'); el.textContent = 'Tap again to delete'; }
      return;
    }
    var act = el.getAttribute('data-act');
    if (act === 'back') closeDetail();
    else if (act === 'refresh') { lastChecked = Date.now(); render(); toast('Status updated', 'Checked just now. Simulated feed.'); }
    else if (act === 'readall') { S.alerts.forEach(function (a) { a.unread = false; }); save(); render(); }
    else if (act === 'gsignin' || act === 'gsync') gSync(true);
    else if (act === 'gsignout') gOut();
    else if (act === 'savekey') { var kv = (document.getElementById('adbkey') || {}).value; kv = (kv || '').trim(); if (kv) { try { localStorage.setItem(ADBK, kv); } catch (x) {} LIVE = {}; render(); toast('Key saved', 'Flight search now uses real schedules.'); } }
    else if (act === 'clearkey') { try { localStorage.removeItem(ADBK); } catch (x) {} LIVE = {}; render(); toast('Key removed'); }
    else if (act === 'resetdemo') { S = seed(); S.sample = !G.linked; save(); render(); toast('Sample data restored'); }
    else if (act === 'clear') { S.flights = []; S.alerts = []; save(); render(); toast('All flights cleared'); }
  });
  document.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-set');
    if (k) { S.settings[k] = e.target.checked; save(); if (k === 'push' && e.target.checked) toast('Push notifications on', 'Install to Home Screen on iPhone to receive them.'); }
  });
  window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if ((ALL.indexOf(h) >= 0 || h === 'journey' || h === 'passports') && h !== view) go(h); });

  /* ---------- forms ---------- */
  function bindForm() {
    var form = document.getElementById('addForm'), pform = document.getElementById('addPassForm');
    bindSearch();
    if (pform) {
      var who = document.getElementById('who');
      var syncWho = function () { Array.prototype.forEach.call(document.querySelectorAll('.nt'), function (el) { el.hidden = who.value !== '__new'; }); };
      who.addEventListener('change', syncWho); syncWho();
      pform.addEventListener('submit', function (e) {
        e.preventDefault();
        var v = function (n) { return (pform.elements[n].value || '').trim(); }, err = document.getElementById('formErr');
        var isNew = v('who') === '__new', name = isNew ? v('tname') : v('who');
        var hasP = !!(v('pnum') || v('issued') || v('pexp'));
        if (!name) { err.textContent = 'Add the traveller’s name.'; return; }
        if (isNew && S.travellers.some(function (t) { return t.name.toLowerCase() === name.toLowerCase(); })) { err.textContent = 'That traveller already exists. Choose them from the list.'; return; }
        if (!isNew && !hasP) { err.textContent = 'Add passport details for ' + name + '.'; return; }
        if (hasP) {
          var miss = []; if (!v('pnum')) miss.push('passport number'); if (!v('issued')) miss.push('issue date'); if (!v('pexp')) miss.push('expiry date');
          if (miss.length) { err.textContent = 'Add the ' + miss.join(', ') + '.'; return; }
          if (v('pexp') <= v('issued')) { err.textContent = 'The expiry date must be after the issue date.'; return; }
        }
        if (isNew) S.travellers.push({ id: 't' + (S.nextId++), name: name, rel: v('trel') });
        if (hasP) S.passports.push({ id: 'p' + (S.nextId++), holder: name, country: v('country'), num: v('pnum').toUpperCase(), issued: v('issued'), exp: v('pexp'), notes: v('pnotes') });
        addWho = ''; save(); go('traveller:passports'); toast(hasP ? 'Passport saved' : 'Traveller added', name);
      });
    }
    if (!form) return;
    var sel = document.getElementById('trip'), box = document.getElementById('newTripBox');
    function sync() { box.hidden = sel.value !== '__new'; }
    if (!sel.options.length || sel.options.length === 1) sel.value = '__new';
    sel.addEventListener('change', sync); sync();
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var v = function (n) { return (form.elements[n].value || '').trim(); }, err = document.getElementById('formErr');
      function code(x) { var m = /[A-Za-z]{3}/.exec(x); return m ? m[0].toUpperCase() : ''; }
      var from = code(v('from')), to = code(v('to')), no = v('no').toUpperCase().replace(/\s+/g, '');
      var missing = [];
      if (!no) missing.push('flight number'); if (!from) missing.push('departure airport'); if (!to) missing.push('arrival airport');
      if (!v('depd') || !v('dept')) missing.push('departure date and time'); if (!v('arrd') || !v('arrt')) missing.push('arrival date and time');
      if (missing.length) { err.textContent = 'Add the ' + missing.join(', ') + '.'; return; }
      if (!AP[from] || !AP[to]) { err.textContent = 'Pick ' + (!AP[from] ? from : to) + ' from the airport list. The real build searches every airport.'; return; }
      var dep = L(v('depd') + ' ' + v('dept'), AP[from].tz), arr = L(v('arrd') + ' ' + v('arrt'), AP[to].tz);
      if (arr <= dep) { err.textContent = 'Arrival must be after departure. Check the dates and times.'; return; }
      var trip = sel.value === '__new' ? (v('newTrip') || (AP[to].n + ' trip')) : sel.value;
      var f = { id: 'f' + (S.nextId++), trip: trip, airline: v('airline'), no: no, from: from, to: to, dep: dep, arr: arr, ref: v('ref').toUpperCase(), ticket: v('ticket'), seat: v('seat').toUpperCase(), terminal: v('terminal').toUpperCase(), gate: v('gate').toUpperCase(), delay: 0, cabin: v('cabin'), notes: v('notes'), pax: v('pax') ? v('pax').split(',').map(function (x) { return x.trim(); }).filter(Boolean) : [] };
      S.flights.push(f); save(); go('flights'); toast('Flight added', f.no + ' ' + from + ' to ' + to);
    });
  }

  /* ---------- appearance ---------- */
  var AKEY = 'flight-deck-appearance';
  /* each colour: [light accent, text on accent, accent as text] then the same three for dark */
  var ACC = {
    amber: { n: 'Amber', l: ['#F2A900', '#1A1200', '#8A5600'], d: ['#F5B82E', '#1A1200', '#F5B82E'] },
    gold: { n: 'Gold', l: ['#C9A227', '#1A1400', '#7A6000'], d: ['#E2BC4A', '#1A1400', '#E2BC4A'] },
    sky: { n: 'Sky', l: ['#1D8FE1', '#FFFFFF', '#0B62A8'], d: ['#5BB8F5', '#04121F', '#5BB8F5'] },
    emerald: { n: 'Emerald', l: ['#1B9E6B', '#FFFFFF', '#0F6B47'], d: ['#4CC38A', '#04170E', '#4CC38A'] },
    violet: { n: 'Violet', l: ['#7A4FE0', '#FFFFFF', '#5A32BD'], d: ['#A98BFF', '#120A2B', '#A98BFF'] },
    rose: { n: 'Rose', l: ['#E0386B', '#FFFFFF', '#B01C4C'], d: ['#FF7A9E', '#2B0711', '#FF7A9E'] }
  };
  var appr = { theme: 'auto', accent: 'amber', touched: false };
  try { var sv = JSON.parse(localStorage.getItem(AKEY)); if (sv) { appr.theme = ['auto', 'light', 'dark'].indexOf(sv.theme) >= 0 ? sv.theme : 'auto'; appr.accent = ACC[sv.accent] ? sv.accent : 'amber'; appr.touched = !!sv.touched; } } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true; if (t === 'light') return false;
    return !!(mq && mq.matches);
  }
  function applyAppearance() {
    var r = document.documentElement;
    if (appr.touched) { if (appr.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', appr.theme); }
    var c = ACC[appr.accent], v = isDark() ? c.d : c.l, s = r.style;
    s.setProperty('--accent', v[0]); s.setProperty('--on-accent', v[1]); s.setProperty('--accent-text', v[2]); s.setProperty('--accent-hero', c.d[0]);
  }
  function saveAppr() { try { localStorage.setItem(AKEY, JSON.stringify(appr)); } catch (e) {} }
  function appearanceCard() {
    var h = '<div class="card"><span class="label">Appearance</span><div class="seg" role="radiogroup" aria-label="Theme">';
    [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']].forEach(function (o) {
      h += '<button type="button" class="seg-b" role="radio" aria-checked="' + (appr.theme === o[0]) + '" data-theme-pick="' + o[0] + '">' + o[1] + '</button>';
    });
    h += '</div><div class="note">Auto follows your iPhone\'s light or dark setting.</div><span class="label" style="margin-top:4px">Theme colour</span><div class="swatches" role="radiogroup" aria-label="Theme colour">';
    var dark = isDark();
    Object.keys(ACC).forEach(function (k) {
      var c = ACC[k];
      h += '<button type="button" class="sw-c" role="radio" aria-checked="' + (appr.accent === k) + '" data-accent-pick="' + k + '"><span class="dotc" style="background:' + (dark ? c.d[0] : c.l[0]) + '"></span><span>' + c.n + '</span></button>';
    });
    return h + '</div></div>';
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-theme-pick],[data-accent-pick]'); if (!t) return;
    if (t.hasAttribute('data-theme-pick')) { appr.theme = t.getAttribute('data-theme-pick'); appr.touched = true; }
    else appr.accent = t.getAttribute('data-accent-pick');
    saveAppr(); applyAppearance(); render();
  });
  try { if (mq) mq.addEventListener('change', function () { applyAppearance(); if (view === 'settings') render(); }); } catch (e) {}

  /* ---------- boot ---------- */
  var dl = document.getElementById('apts');
  dl.innerHTML = Object.keys(AP).map(function (k) { return '<option value="' + k + '">' + AP[k].n + '</option>'; }).join('');
  applyAppearance();
  var h0 = location.hash.slice(1); if (h0 === 'journey' || h0 === 'passports') { tsub = h0; h0 = 'traveller'; } if (ALL.indexOf(h0) >= 0) view = h0;
  render();
})();
</script>
